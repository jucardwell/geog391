name: Verify tutorials
on:
  push:
    branches: [verify-tutorials]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install system libraries for spatial R packages
        run: sudo apt-get update && sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev libglpk-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::sf
            any::tmap
            any::spdep
            any::spatialreg
            any::sfdep
            any::terra
            any::stars
            any::sp
            any::gstat
            any::spatstat
            any::gt
            any::e1071
            any::maptiles
            any::car
            any::classInt
      - name: Run every chunk
        run: bash verify/run_all.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-out
          path: verify/out
